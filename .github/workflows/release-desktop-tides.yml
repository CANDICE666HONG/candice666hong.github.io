name: Desktop Tides Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop-app/**'
      - 'source-games/desktop-tides/**'
      - 'scripts/build-desktop.mjs'
      - 'scripts/build-offline.mjs'
      - '.github/workflows/release-desktop-tides.yml'

permissions:
  contents: read

concurrency:
  group: desktop-tides-windows-release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check whether this version needs a release
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $metadata = Get-Content -Raw desktop-app/package.json | ConvertFrom-Json
          if ($metadata.version -notmatch '^\d+\.\d+\.\d+$') { throw 'Use a stable x.y.z desktop version.' }
          $tag = "desktop-tides-v$($metadata.version)"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $existing = $null
          try {
            $existing = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/releases/tags/$tag" -Headers $headers
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }
          if ($existing) {
            if ($existing.draft -or 'Desktop-Tides-Windows.exe' -notin $existing.assets.name -or
                'Desktop-Tides-Windows.exe.sha256' -notin $existing.assets.name) {
              throw "Release $tag is incomplete. Review it before attempting another upload."
            }
            'build=false' | Add-Content -Encoding utf8 $env:GITHUB_OUTPUT
            "Version $($metadata.version) is already published. Its download stays unchanged; bump desktop-app/package.json to release another build." | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          } else {
            'build=true' | Add-Content -Encoding utf8 $env:GITHUB_OUTPUT
          }

  build:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Install build tools
        shell: pwsh
        run: |
          npm install --global pnpm@11.25.0
          if ($LASTEXITCODE -ne 0) { throw 'pnpm installation failed.' }
          pnpm --dir source-games/desktop-tides --ignore-workspace install --no-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Game dependency installation failed.' }
          pnpm --dir desktop-app install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Desktop dependency installation failed.' }
          node desktop-app/node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { throw 'Electron runtime installation failed.' }
      - name: Check game and build Windows portable app
        shell: pwsh
        run: |
          node --test source-games/desktop-tides/tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Game tests failed.' }
          node scripts/build-desktop.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed.' }
      - name: Record source and verify output
        shell: pwsh
        run: |
          $metadata = Get-Content -Raw desktop-app/package.json | ConvertFrom-Json
          if ($metadata.version -notmatch '^\d+\.\d+\.\d+$') { throw 'Use a stable x.y.z desktop version.' }
          $exePath = 'desktop-app/release/Desktop-Tides-Windows.exe'
          if (-not (Test-Path -LiteralPath $exePath)) { throw 'Portable EXE is missing.' }
          $sha256 = (Get-FileHash -LiteralPath $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha256  Desktop-Tides-Windows.exe" | Set-Content -Encoding utf8NoBOM "$exePath.sha256"
          @{
            version = $metadata.version
            tag = "desktop-tides-v$($metadata.version)"
            commit = $env:GITHUB_SHA
            sha256 = $sha256
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM desktop-app/release/release.json
      - name: Save tested package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: desktop-tides-windows
          path: |
            desktop-app/release/Desktop-Tides-Windows.exe
            desktop-app/release/Desktop-Tides-Windows.exe.sha256
            desktop-app/release/release.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: desktop-tides-windows
          path: release
      - name: Publish a new version without replacing an existing download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $metadata = Get-Content -Raw release/release.json | ConvertFrom-Json
          if ($metadata.tag -notmatch '^desktop-tides-v\d+\.\d+\.\d+$' -or $metadata.commit -ne $env:GITHUB_SHA) {
            throw 'Release metadata does not match this build.'
          }
          $actual = (Get-FileHash -LiteralPath release/Desktop-Tides-Windows.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $metadata.sha256) { throw 'Downloaded artifact checksum mismatch.' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $existing = $null
          try {
            $existing = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/releases/tags/$($metadata.tag)" -Headers $headers
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }
          if ($existing) {
            if (-not $existing.draft -and
                'Desktop-Tides-Windows.exe' -in $existing.assets.name -and
                'Desktop-Tides-Windows.exe.sha256' -in $existing.assets.name) {
              "This version is already published at $($existing.html_url); leaving its files unchanged." | Write-Output
              exit 0
            }
            throw "Release $($metadata.tag) already exists. Keep it intact; bump desktop-app/package.json for a new release."
          }
          @"
          桌边潮汐 · Windows 免安装版

          下载 Desktop-Tides-Windows.exe，双击即可游玩。无需浏览器或联网。
          昼夜跟随电脑时间，也可以手动切换；图鉴和设置保存在当前电脑。
          Windows 10 / 11，64 位。当前试玩版未做代码签名。

          Source: $($metadata.commit)
          SHA-256: $($metadata.sha256)
          "@ | Set-Content -Encoding utf8NoBOM release/notes.md
          gh release create $metadata.tag release/Desktop-Tides-Windows.exe release/Desktop-Tides-Windows.exe.sha256 --repo $env:GH_REPO --target $metadata.commit --title "桌边潮汐 Windows $($metadata.version)" --notes-file release/notes.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; any partial release remains a draft.' }
          gh release edit $metadata.tag --repo $env:GH_REPO --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the uploaded draft release.' }
